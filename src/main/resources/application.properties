# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# JWT Configuration
# Secret key for signing JWT tokens (HMAC-SHA512) ? CHANGE IN PRODUCTION!
app.security.jwt.secret=c2VjdXJlYXBwLWp3dC1zZWNyZXQta2V5LWZvci1obWFjLXNoYTUxMi1hbGdvcml0aG0tMjAyNi1wcm9kdWN0aW9uLWdyYWRlLXNlY3VyZS1rZXktbXVzdC1iZS1hdC1sZWFzdC01MTItYml0cw==
# JWT access token expiration in milliseconds (15 minutes)
app.security.jwt.expiration-ms=900000
# JWT issuer
app.security.jwt.issuer=secureapp
# JWT cookie name (HttpOnly, Secure, SameSite=Strict)
app.security.jwt.cookie-name=ACCESS_TOKEN

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/secureapp_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.secureapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/secureapp.log

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=false
spring.jackson.time-zone=UTC

# Security Configuration
# CSRF enabled ? required because JWT is in HttpOnly cookie (auto-attached by browser)
app.security.enable-csrf=true
app.security.enable-cors=true
app.security.cors.allowed-origins=http://localhost:4200
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.security.cors.allow-credentials=true
app.security.cors.max-age=3600

# Server Configuration for Security Headers
spring.web.error.include-exception=false

# DPoP (Demonstration of Proof-of-Possession) Configuration
# Maximum allowed proof age / clock skew tolerance in seconds
app.security.dpop.max-proof-age-seconds=300
# Maximum entries in the JTI replay protection cache
app.security.dpop.jti-cache-max-size=100000
